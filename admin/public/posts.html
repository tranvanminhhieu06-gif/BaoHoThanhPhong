<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bài viết - Thành Phong</title>
<link rel="icon" type="image/png" href="images/LOGO/Icon logo.png">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
<style>
  body{font-family:'Be Vietnam Pro',sans-serif;background:#F4F6F9;color:#1A2744;}
  .material-symbols-outlined{font-variation-settings:'FILL' 0,'wght' 500,'GRAD' 0,'opsz' 24;font-size:20px;vertical-align:middle;}
  .scrollbar-thin::-webkit-scrollbar{width:6px;}
  .scrollbar-thin::-webkit-scrollbar-thumb{background:#CBD5E1;border-radius:10px;}
  .post-item.active{background:#1D5FA8;color:#fff;}
  .post-item.active .sub{color:rgba(255,255,255,.75);}

  /* Trình soạn thảo */
  .tb-btn{width:34px;height:34px;display:flex;align-items:center;justify-content:center;border-radius:8px;color:#475569;transition:.15s;}
  .tb-btn:hover{background:#EBF3FF;color:#1D5FA8;}
  .tb-sep{width:1px;height:22px;background:#E2E8F0;margin:0 4px;}

  #editor{min-height:420px;outline:none;font-size:15px;line-height:1.8;color:#334155;}
  #editor:empty:before{content:attr(data-placeholder);color:#94A3B8;}
  #editor p{margin:0 0 14px;}
  #editor h2{font-size:22px;font-weight:800;color:#1A2744;margin:24px 0 12px;}
  #editor h3{font-size:18px;font-weight:800;color:#1A2744;margin:20px 0 10px;}
  #editor ul{list-style:disc;padding-left:22px;margin:0 0 14px;}
  #editor ol{list-style:decimal;padding-left:22px;margin:0 0 14px;}
  #editor li{margin-bottom:6px;}
  #editor a{color:#1D5FA8;text-decoration:underline;}
  #editor img{max-width:100%;height:auto;border-radius:12px;margin:14px 0;}
  #editor blockquote{border-left:4px solid #1D5FA8;background:#F1F5F9;padding:10px 14px;border-radius:0 10px 10px 0;margin:0 0 14px;font-style:italic;}
</style>
</head>
<body class="min-h-screen">

<!-- Đăng nhập -->
<div id="loginScreen" class="fixed inset-0 z-50 bg-[#F4F6F9] items-center justify-center p-4" style="display:none;">
  <form id="loginForm" class="bg-white w-full max-w-sm rounded-2xl border border-gray-200 shadow-sm p-8">
    <div class="text-center mb-6">
      <img src="images/LOGO/Icon logo.png" alt="Logo" class="h-12 w-12 object-contain mx-auto mb-3" onerror="this.style.display='none'">
      <h1 class="text-lg font-extrabold text-[#1A2744]">Bài viết</h1>
      <p class="text-xs text-gray-400 font-medium mt-1">Thành Phong Bảo Hộ Lao Động</p>
    </div>
    <label class="block text-xs font-extrabold uppercase tracking-wide text-gray-500 mb-2">Mật khẩu</label>
    <input id="loginPassword" type="password" autocomplete="current-password" placeholder="Nhập mật khẩu"
      class="w-full px-4 py-2.5 rounded-xl border border-gray-200 text-sm font-medium focus:outline-none focus:ring-2 focus:ring-[#1D5FA8]/20 focus:border-[#1D5FA8]">
    <p id="loginError" class="hidden mt-3 text-sm font-semibold text-red-600 bg-red-50 border border-red-100 rounded-xl px-4 py-2"></p>
    <button type="submit" id="loginBtn"
      class="mt-5 w-full px-5 py-3 rounded-xl bg-[#1D5FA8] text-white text-sm font-bold hover:bg-[#164A85] active:scale-95 transition">
      Đăng nhập
    </button>
  </form>
</div>

<header class="sticky top-0 z-30 bg-white border-b border-gray-200">
  <div class="max-w-[1500px] mx-auto px-5 py-3 flex items-center justify-between gap-4">
    <div class="flex items-center gap-3">
      <img src="images/LOGO/Icon logo.png" alt="Logo" class="h-9 w-9 object-contain" onerror="this.style.display='none'">
      <div>
        <h1 class="text-base font-extrabold text-[#1A2744] leading-tight">Bài viết</h1>
        <p class="text-[11px] text-gray-400 font-medium leading-tight">Tin tức &amp; kiến thức</p>
      </div>
    </div>
    <div class="flex items-center gap-2">
      <a href="index.html" class="flex items-center gap-2 px-4 py-2.5 rounded-xl border border-gray-200 text-sm font-bold text-gray-600 hover:bg-gray-50 transition">
        <span class="material-symbols-outlined text-[18px]">inventory_2</span>
        <span class="hidden sm:inline">Sản phẩm</span>
      </a>
      <a href="boxes.html" class="flex items-center gap-2 px-4 py-2.5 rounded-xl border border-gray-200 text-sm font-bold text-gray-600 hover:bg-gray-50 transition">
        <span class="material-symbols-outlined text-[18px]">dashboard_customize</span>
        <span class="hidden sm:inline">Khối nội dung</span>
      </a>
      <button id="saveBtn" class="flex items-center gap-2 px-5 py-2.5 rounded-xl bg-[#1D5FA8] text-white text-sm font-bold hover:bg-[#164A85] transition active:scale-95 disabled:opacity-40">
        <span class="material-symbols-outlined text-[18px]">save</span> Lưu bài
      </button>
      <button id="logoutBtn" title="Đăng xuất" style="display:none;"
        class="w-10 h-10 items-center justify-center rounded-xl border border-gray-200 text-gray-500 hover:bg-gray-100 transition">
        <span class="material-symbols-outlined text-[20px]">logout</span>
      </button>
    </div>
  </div>
</header>

<main class="max-w-[1500px] mx-auto px-5 py-6 flex flex-col lg:flex-row gap-6">

  <!-- Danh sách bài -->
  <aside class="lg:w-72 shrink-0">
    <div class="bg-white rounded-2xl border border-gray-200 p-4 lg:sticky lg:top-20">
      <button id="newPostBtn" class="w-full flex items-center justify-center gap-2 px-4 py-2.5 mb-4 rounded-xl bg-[#1D5FA8] text-white text-sm font-bold hover:bg-[#164A85] transition active:scale-95">
        <span class="material-symbols-outlined text-[18px]">edit_note</span> Viết bài mới
      </button>
      <h3 class="text-xs font-extrabold uppercase tracking-widest text-[#1D5FA8] mb-3">
        Bài đã đăng <span id="postCount" class="text-gray-400"></span>
      </h3>
      <div id="postList" class="space-y-1 max-h-[65vh] overflow-y-auto scrollbar-thin pr-1"></div>
    </div>
  </aside>

  <!-- Soạn bài -->
  <section class="flex-1 min-w-0">
    <div id="emptyPick" class="bg-white rounded-2xl border border-gray-200 py-24 text-center text-gray-400">
      <span class="material-symbols-outlined text-5xl mb-2 block">article</span>
      <p class="font-semibold">Chọn một bài ở cột trái, hoặc bấm "Viết bài mới".</p>
    </div>

    <div id="editorWrap" style="display:none;">
      <div class="bg-white rounded-2xl border border-gray-200 p-5 mb-5">
        <div class="flex items-center justify-between gap-3 mb-4">
          <h2 id="editorMode" class="text-sm font-extrabold text-[#1A2744]"></h2>
          <div class="flex items-center gap-2">
            <a id="viewLink" href="#" target="_blank" style="display:none;"
               class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg border border-gray-200 text-xs font-bold text-gray-600 hover:bg-gray-50 transition">
              <span class="material-symbols-outlined text-[16px]">open_in_new</span> Xem trên web
            </a>
            <button id="deleteBtn" style="display:none;"
              class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-bold text-gray-500 hover:bg-red-50 hover:text-red-600 transition">
              <span class="material-symbols-outlined text-[16px]">delete</span> Xóa bài
            </button>
          </div>
        </div>

        <label class="block text-xs font-extrabold uppercase tracking-wide text-gray-500 mb-2">Tiêu đề bài viết *</label>
        <input id="titleInput" type="text" placeholder="VD: 5 lưu ý khi chọn giày bảo hộ cho công trình"
          class="w-full px-4 py-3 rounded-xl border border-gray-200 text-base font-bold mb-4 focus:outline-none focus:ring-2 focus:ring-[#1D5FA8]/20 focus:border-[#1D5FA8]">

        <label class="block text-xs font-extrabold uppercase tracking-wide text-gray-500 mb-2">Tóm tắt ngắn</label>
        <textarea id="excerptInput" rows="2" placeholder="Đoạn tóm tắt hiện ở thẻ tin ngoài trang chủ..."
          class="w-full px-4 py-2.5 rounded-xl border border-gray-200 text-sm font-medium mb-4 focus:outline-none focus:ring-2 focus:ring-[#1D5FA8]/20 focus:border-[#1D5FA8]"></textarea>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-4">
          <div>
            <label class="block text-xs font-extrabold uppercase tracking-wide text-gray-500 mb-2">Chủ đề</label>
            <input id="categoryInput" type="text" placeholder="An toàn lao động" list="catList"
              class="w-full px-4 py-2.5 rounded-xl border border-gray-200 text-sm font-medium focus:outline-none focus:ring-2 focus:ring-[#1D5FA8]/20 focus:border-[#1D5FA8]">
            <datalist id="catList"></datalist>
          </div>
          <div>
            <label class="block text-xs font-extrabold uppercase tracking-wide text-gray-500 mb-2">Nhãn trên ảnh</label>
            <input id="tagInput" type="text" placeholder="Nổi bật / Pháp luật / Kiến thức"
              class="w-full px-4 py-2.5 rounded-xl border border-gray-200 text-sm font-medium focus:outline-none focus:ring-2 focus:ring-[#1D5FA8]/20 focus:border-[#1D5FA8]">
          </div>
          <div>
            <label class="block text-xs font-extrabold uppercase tracking-wide text-gray-500 mb-2">Ngày đăng</label>
            <input id="dateInput" type="date"
              class="w-full px-4 py-2.5 rounded-xl border border-gray-200 text-sm font-medium focus:outline-none focus:ring-2 focus:ring-[#1D5FA8]/20 focus:border-[#1D5FA8]">
          </div>
          <div>
            <label class="block text-xs font-extrabold uppercase tracking-wide text-gray-500 mb-2">Người viết</label>
            <input id="authorInput" type="text" placeholder="Thành Phong"
              class="w-full px-4 py-2.5 rounded-xl border border-gray-200 text-sm font-medium focus:outline-none focus:ring-2 focus:ring-[#1D5FA8]/20 focus:border-[#1D5FA8]">
          </div>
        </div>

        <label class="block text-xs font-extrabold uppercase tracking-wide text-gray-500 mb-2">Link bài gốc (nếu dẫn lại từ báo khác)</label>
        <input id="sourceInput" type="url" placeholder="https://... (để trống nếu tự viết)"
          class="w-full px-4 py-2.5 rounded-xl border border-gray-200 text-sm font-medium mb-4 focus:outline-none focus:ring-2 focus:ring-[#1D5FA8]/20 focus:border-[#1D5FA8]">

        <label class="flex items-center gap-2 mb-4 cursor-pointer">
          <input id="featuredInput" type="checkbox" class="w-4 h-4 rounded border-gray-300 text-[#1D5FA8] focus:ring-[#1D5FA8]">
          <span class="text-sm font-semibold text-gray-600">Đặt làm bài nổi bật (ô lớn trên trang chủ)</span>
        </label>

        <label class="block text-xs font-extrabold uppercase tracking-wide text-gray-500 mb-2">Ảnh bìa</label>
        <label for="coverInput" id="coverDrop"
          class="flex flex-col items-center justify-center gap-2 border-2 border-dashed border-gray-200 rounded-2xl h-44 cursor-pointer overflow-hidden relative hover:border-[#1D5FA8] transition">
          <img id="coverPreview" class="hidden absolute inset-0 w-full h-full object-cover">
          <span id="coverPlaceholder" class="flex flex-col items-center gap-1 text-gray-400">
            <span class="material-symbols-outlined text-3xl">add_photo_alternate</span>
            <span class="text-xs font-semibold">Chọn hoặc kéo thả ảnh bìa</span>
          </span>
        </label>
        <input type="file" id="coverInput" accept="image/*" class="hidden">
      </div>

      <!-- Nội dung bài -->
      <div class="bg-white rounded-2xl border border-gray-200 overflow-hidden">
        <div class="flex flex-wrap items-center gap-1 px-3 py-2 border-b border-gray-100 bg-gray-50 sticky top-[68px] z-20">
          <button type="button" class="tb-btn" data-cmd="bold" title="In đậm"><span class="material-symbols-outlined text-[18px]">format_bold</span></button>
          <button type="button" class="tb-btn" data-cmd="italic" title="In nghiêng"><span class="material-symbols-outlined text-[18px]">format_italic</span></button>
          <button type="button" class="tb-btn" data-cmd="underline" title="Gạch chân"><span class="material-symbols-outlined text-[18px]">format_underlined</span></button>
          <span class="tb-sep"></span>
          <button type="button" class="tb-btn" data-block="H2" title="Tiêu đề lớn"><span class="text-xs font-extrabold">H2</span></button>
          <button type="button" class="tb-btn" data-block="H3" title="Tiêu đề nhỏ"><span class="text-xs font-extrabold">H3</span></button>
          <button type="button" class="tb-btn" data-block="P" title="Đoạn văn thường"><span class="material-symbols-outlined text-[18px]">notes</span></button>
          <span class="tb-sep"></span>
          <button type="button" class="tb-btn" data-cmd="insertUnorderedList" title="Danh sách gạch đầu dòng"><span class="material-symbols-outlined text-[18px]">format_list_bulleted</span></button>
          <button type="button" class="tb-btn" data-cmd="insertOrderedList" title="Danh sách đánh số"><span class="material-symbols-outlined text-[18px]">format_list_numbered</span></button>
          <button type="button" class="tb-btn" data-block="BLOCKQUOTE" title="Trích dẫn"><span class="material-symbols-outlined text-[18px]">format_quote</span></button>
          <span class="tb-sep"></span>
          <button type="button" class="tb-btn" id="linkBtn" title="Chèn liên kết"><span class="material-symbols-outlined text-[18px]">link</span></button>
          <button type="button" class="tb-btn" id="imgBtn" title="Chèn ảnh vào bài"><span class="material-symbols-outlined text-[18px]">image</span></button>
          <span class="tb-sep"></span>
          <button type="button" class="tb-btn" data-cmd="removeFormat" title="Xóa định dạng"><span class="material-symbols-outlined text-[18px]">format_clear</span></button>
          <span class="ml-auto text-[11px] font-bold text-gray-400 pr-2" id="wordCount"></span>
        </div>
        <div id="editor" contenteditable="true" data-placeholder="Viết nội dung bài ở đây..." class="p-6"></div>
      </div>
      <input type="file" id="inlineImgInput" accept="image/*" class="hidden">

      <p id="formError" class="hidden mt-4 text-sm font-semibold text-red-600 bg-red-50 border border-red-100 rounded-xl px-4 py-3"></p>
    </div>
  </section>
</main>

<div id="toast" class="fixed bottom-6 right-6 z-50 opacity-0 translate-y-4 pointer-events-none transition duration-200">
  <div id="toastBody" class="px-5 py-3 rounded-xl shadow-xl text-sm font-bold text-white bg-[#1A2744]"></div>
</div>

<script src="posts.js"></script>
</body>
</html>
