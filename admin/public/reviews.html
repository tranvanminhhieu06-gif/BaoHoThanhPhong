<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hỏi đáp / Phản hồi - Thành Phong</title>
<link rel="icon" type="image/png" href="images/LOGO/Icon logo.png">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
<style>
  body{font-family:'Be Vietnam Pro',sans-serif;background:#F4F6F9;color:#1A2744;}
  .material-symbols-outlined{font-variation-settings:'FILL' 0,'wght' 500,'GRAD' 0,'opsz' 24;font-size:20px;vertical-align:middle;}
  .stars{color:#F5A623;letter-spacing:2px;}
  .stars .off{color:#D8DEE6;}
  .tab-btn.active{background:#1D5FA8;color:#fff;}
</style>
</head>
<body class="min-h-screen">

<!-- Đăng nhập -->
<div id="loginScreen" class="fixed inset-0 z-50 bg-[#F4F6F9] items-center justify-center p-4" style="display:none;">
  <form id="loginForm" class="bg-white w-full max-w-sm rounded-2xl border border-gray-200 shadow-sm p-8">
    <div class="text-center mb-6">
      <img src="images/LOGO/Icon logo.png" alt="Logo" class="h-12 w-12 object-contain mx-auto mb-3" onerror="this.style.display='none'">
      <h1 class="text-lg font-extrabold text-[#1A2744]">Hỏi đáp / Phản hồi</h1>
      <p class="text-xs text-gray-400 font-medium mt-1">Thành Phong Bảo Hộ Lao Động</p>
    </div>
    <label class="block text-xs font-extrabold uppercase tracking-wide text-gray-500 mb-2">Mật khẩu</label>
    <input id="loginPassword" type="password" autocomplete="current-password" placeholder="Nhập mật khẩu"
      class="w-full px-4 py-2.5 rounded-xl border border-gray-200 text-sm font-medium focus:outline-none focus:ring-2 focus:ring-[#1D5FA8]/20 focus:border-[#1D5FA8]">
    <p id="loginError" class="hidden mt-3 text-sm font-semibold text-red-600 bg-red-50 border border-red-100 rounded-xl px-4 py-2"></p>
    <button type="submit" id="loginBtn"
      class="mt-5 w-full px-5 py-3 rounded-xl bg-[#1D5FA8] text-white text-sm font-bold hover:bg-[#164A85] active:scale-95 transition">
      Đăng nhập
    </button>
  </form>
</div>

<header class="sticky top-0 z-30 bg-white border-b border-gray-200">
  <div class="max-w-[1200px] mx-auto px-5 py-3 flex items-center justify-between gap-4">
    <div class="flex items-center gap-3">
      <img src="images/LOGO/Icon logo.png" alt="Logo" class="h-9 w-9 object-contain" onerror="this.style.display='none'">
      <div>
        <h1 class="text-base font-extrabold text-[#1A2744] leading-tight">Hỏi đáp / Phản hồi</h1>
        <p class="text-[11px] text-gray-400 font-medium leading-tight">Đánh giá của khách hàng</p>
      </div>
    </div>
    <div class="flex items-center gap-2">
      <div id="gitStatus" class="mr-1"></div>
      <a href="index.html" class="flex items-center gap-2 px-4 py-2.5 rounded-xl border border-gray-200 text-sm font-bold text-gray-600 hover:bg-gray-50 transition">
        <span class="material-symbols-outlined text-[18px]">inventory_2</span>
        <span class="hidden sm:inline">Sản phẩm</span>
      </a>
      <a href="posts.html" class="flex items-center gap-2 px-4 py-2.5 rounded-xl border border-gray-200 text-sm font-bold text-gray-600 hover:bg-gray-50 transition">
        <span class="material-symbols-outlined text-[18px]">edit_note</span>
        <span class="hidden sm:inline">Bài viết</span>
      </a>
      <a href="https://baohothanhphong.vn" target="_blank" title="Mở website thật"
         class="flex items-center gap-2 px-4 py-2.5 rounded-xl border border-gray-200 text-sm font-bold text-gray-600 hover:bg-gray-50 transition">
        <span class="material-symbols-outlined text-[18px]">open_in_new</span>
        <span class="hidden sm:inline">Website</span>
      </a>
      <button id="logoutBtn" title="Đăng xuất" style="display:none;"
        class="w-10 h-10 items-center justify-center rounded-xl border border-gray-200 text-gray-500 hover:bg-gray-100 transition">
        <span class="material-symbols-outlined text-[20px]">logout</span>
      </button>
    </div>
  </div>
</header>

<main class="max-w-[1200px] mx-auto px-5 py-6">

  <div class="flex flex-wrap items-center gap-2 mb-6">
    <button class="tab-btn active px-5 py-2.5 rounded-xl text-sm font-bold border border-gray-200 bg-white text-gray-600 transition" data-filter="pending">
      Chờ duyệt <span id="cntPending" class="ml-1"></span>
    </button>
    <button class="tab-btn px-5 py-2.5 rounded-xl text-sm font-bold border border-gray-200 bg-white text-gray-600 transition" data-filter="approved">
      Đã đăng <span id="cntApproved" class="ml-1"></span>
    </button>
    <button class="tab-btn px-5 py-2.5 rounded-xl text-sm font-bold border border-gray-200 bg-white text-gray-600 transition" data-filter="general">
      Đánh giá chung <span id="cntGeneral" class="ml-1"></span>
    </button>
    <button class="tab-btn px-5 py-2.5 rounded-xl text-sm font-bold border border-gray-200 bg-white text-gray-600 transition" data-filter="all">
      Tất cả
    </button>

    <button id="addBtn" class="ml-auto flex items-center gap-2 px-5 py-2.5 rounded-xl bg-[#1D5FA8] text-white text-sm font-bold hover:bg-[#164A85] transition active:scale-95">
      <span class="material-symbols-outlined text-[18px]">add</span> Thêm đánh giá
    </button>
  </div>

  <div id="list" class="space-y-4"></div>

  <div id="empty" class="hidden bg-white rounded-2xl border border-gray-200 py-20 text-center text-gray-400">
    <span class="material-symbols-outlined text-5xl mb-2 block">forum</span>
    <p class="font-semibold" id="emptyText">Chưa có phản hồi nào.</p>
  </div>
</main>

<!-- Thêm đánh giá thủ công -->
<div id="addBackdrop" class="fixed inset-0 z-40 hidden items-center justify-center p-4" style="background:rgba(15,23,42,.55);">
  <div class="bg-white w-full max-w-lg rounded-2xl shadow-2xl max-h-[90vh] overflow-y-auto">
    <form id="addForm">
      <div class="flex items-center justify-between px-6 py-4 border-b border-gray-100">
        <h2 class="text-lg font-extrabold text-[#1A2744]">Thêm đánh giá</h2>
        <button type="button" id="addClose" class="w-9 h-9 flex items-center justify-center rounded-full hover:bg-gray-100">
          <span class="material-symbols-outlined">close</span>
        </button>
      </div>

      <div class="p-6 space-y-4">
        <div>
          <label class="block text-xs font-extrabold uppercase tracking-wide text-gray-500 mb-2">Đánh giá cho</label>
          <select id="aProduct" class="w-full px-4 py-2.5 rounded-xl border border-gray-200 text-sm font-medium focus:outline-none focus:ring-2 focus:ring-[#1D5FA8]/20 focus:border-[#1D5FA8]">
            <option value="">⭐ Đánh giá chung về công ty (hiện ở trang chủ)</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-extrabold uppercase tracking-wide text-gray-500 mb-2">Số sao *</label>
          <select id="aRating" class="w-full px-4 py-2.5 rounded-xl border border-gray-200 text-sm font-medium focus:outline-none focus:ring-2 focus:ring-[#1D5FA8]/20 focus:border-[#1D5FA8]">
            <option value="5">★★★★★ (5 sao)</option>
            <option value="4">★★★★ (4 sao)</option>
            <option value="3">★★★ (3 sao)</option>
            <option value="2">★★ (2 sao)</option>
            <option value="1">★ (1 sao)</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-extrabold uppercase tracking-wide text-gray-500 mb-2">Họ tên khách *</label>
          <input id="aAuthor" type="text" maxlength="60" placeholder="VD: Anh Minh Tuấn"
            class="w-full px-4 py-2.5 rounded-xl border border-gray-200 text-sm font-medium focus:outline-none focus:ring-2 focus:ring-[#1D5FA8]/20 focus:border-[#1D5FA8]">
        </div>

        <div>
          <label class="block text-xs font-extrabold uppercase tracking-wide text-gray-500 mb-2">Chức danh / Công ty</label>
          <input id="aRole" type="text" maxlength="120" placeholder="VD: Giám đốc Cty TNHH Bảo vệ Hoàng Long"
            class="w-full px-4 py-2.5 rounded-xl border border-gray-200 text-sm font-medium focus:outline-none focus:ring-2 focus:ring-[#1D5FA8]/20 focus:border-[#1D5FA8]">
          <p class="text-[11px] text-gray-400 font-medium mt-1">Hiện ở dòng nhỏ dưới tên, chủ yếu dùng cho đánh giá chung.</p>
        </div>

        <div>
          <label class="block text-xs font-extrabold uppercase tracking-wide text-gray-500 mb-2">Tóm tắt *</label>
          <input id="aTitle" type="text" maxlength="120" placeholder="VD: Chất lượng vải tốt, giao hàng đúng hẹn"
            class="w-full px-4 py-2.5 rounded-xl border border-gray-200 text-sm font-medium focus:outline-none focus:ring-2 focus:ring-[#1D5FA8]/20 focus:border-[#1D5FA8]">
        </div>

        <div>
          <label class="block text-xs font-extrabold uppercase tracking-wide text-gray-500 mb-2">Nội dung *</label>
          <textarea id="aContent" rows="4" maxlength="2000" placeholder="Nội dung đánh giá của khách..."
            class="w-full px-4 py-2.5 rounded-xl border border-gray-200 text-sm font-medium focus:outline-none focus:ring-2 focus:ring-[#1D5FA8]/20 focus:border-[#1D5FA8]"></textarea>
        </div>

        <div>
          <label class="block text-xs font-extrabold uppercase tracking-wide text-gray-500 mb-2">Ngày đăng</label>
          <input id="aDate" type="date"
            class="w-full px-4 py-2.5 rounded-xl border border-gray-200 text-sm font-medium focus:outline-none focus:ring-2 focus:ring-[#1D5FA8]/20 focus:border-[#1D5FA8]">
        </div>

        <p id="addError" class="hidden text-sm font-semibold text-red-600 bg-red-50 border border-red-100 rounded-xl px-4 py-2"></p>
      </div>

      <div class="flex items-center justify-end gap-3 px-6 py-4 border-t border-gray-100">
        <button type="button" id="addCancel" class="px-5 py-2.5 rounded-xl text-sm font-bold text-gray-500 hover:bg-gray-100">Hủy</button>
        <button type="submit" id="addSubmit" class="px-6 py-2.5 rounded-xl bg-[#1D5FA8] text-white text-sm font-bold hover:bg-[#164A85] active:scale-95 transition">Thêm &amp; đăng</button>
      </div>
    </form>
  </div>
</div>

<div id="toast" class="fixed bottom-6 right-6 z-50 opacity-0 translate-y-4 pointer-events-none transition duration-200">
  <div id="toastBody" class="px-5 py-3 rounded-xl shadow-xl text-sm font-bold text-white bg-[#1A2744]"></div>
</div>

<script src="richtext.js"></script>
<script src="gitstatus.js"></script>
<script src="reviews.js"></script>
</body>
</html>
