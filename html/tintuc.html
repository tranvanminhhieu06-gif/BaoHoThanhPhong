<script src="../js/posts.js"></script>
<script>
(function () {
  var PER_PAGE = 9;
  var page = 1;
  var category = 'all';

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  // Cho phép in đậm / nghiêng / gạch chân trong nội dung soạn từ trang quản lý
  function inlineHtml(s) {
    return esc(s).replace(/&lt;(\/?)(b|strong|i|em|u)&gt;/gi, '<$1$2>');
  }

  function formatDate(iso) {
    if (!iso) return '';
    var p = String(iso).split('-');
    return p.length === 3 ? p[2] + '/' + p[1] + '/' + p[0] : iso;
  }

  var all = (typeof posts !== 'undefined' ? posts : []).slice()
    .sort(function (a, b) { return String(b.date).localeCompare(String(a.date)); });

  function filtered() {
    return category === 'all' ? all : all.filter(function (p) { return (p.category || 'Tin tức') === category; });
  }

  function renderFilters() {
    var cats = [];
    all.forEach(function (p) {
      var c = p.category || 'Tin tức';
      if (cats.indexOf(c) === -1) cats.push(c);
    });

    var html = ['all'].concat(cats).map(function (c) {
      var active = category === c;
      var label = c === 'all' ? 'Tất cả' : c;
      return '<button data-cat="' + esc(c) + '" class="px-5 py-2.5 rounded-2xl text-sm font-bold transition-all btn-press ' +
        (active ? 'bg-[#1D5FA8] text-white shadow-lg' : 'bg-white border border-gray-200 text-gray-600 hover:border-[#1D5FA8] hover:text-[#1D5FA8]') +
        '">' + esc(label) + '</button>';
    }).join('');

    var el = document.getElementById('filters');
    el.innerHTML = html;
    el.querySelectorAll('[data-cat]').forEach(function (b) {
      b.addEventListener('click', function () { category = b.dataset.cat; page = 1; render(); });
    });
  }

  function render() {
    var list = filtered();
    var grid = document.getElementById('grid');
    var empty = document.getElementById('empty');

    if (!list.length) {
      grid.innerHTML = '';
      empty.classList.remove('hidden');
      document.getElementById('pagination').innerHTML = '';
      renderFilters();
      return;
    }
    empty.classList.add('hidden');

    var totalPages = Math.ceil(list.length / PER_PAGE);
    if (page > totalPages) page = totalPages;
    var slice = list.slice((page - 1) * PER_PAGE, page * PER_PAGE);

    grid.innerHTML = slice.map(function (p) {
      var url = '../tintuc/index.html?bai=' + encodeURIComponent(p.slug);
      return '<a href="' + url + '" class="post-card bg-white rounded-3xl border border-gray-100 overflow-hidden block">' +
        '<div class="aspect-[16/10] bg-gray-100 overflow-hidden relative">' +
        (p.cover ? '<img src="' + esc(p.cover) + '" alt="' + esc(p.title) + '" loading="lazy" class="w-full h-full object-cover">' : '') +
        (p.tag ? '<span class="absolute top-4 left-4 px-3 py-1 rounded-full bg-white/95 text-[#1D5FA8] text-[10px] font-extrabold uppercase tracking-widest">' + esc(p.tag) + '</span>' : '') +
        '</div>' +
        '<div class="p-6">' +
        '<div class="flex items-center gap-3 text-[11px] font-bold text-gray-400 mb-3">' +
        '<span>' + esc(formatDate(p.date)) + '</span><span>·</span><span>' + esc(p.category || 'Tin tức') + '</span>' +
        '</div>' +
        '<h3 class="font-extrabold text-[#1A2744] text-base leading-snug mb-2">' + esc(p.title) + '</h3>' +
        '<p class="text-sm text-gray-500 leading-relaxed line-clamp-3">' + inlineHtml(p.excerpt || '') + '</p>' +
        '<span class="inline-flex items-center gap-1.5 mt-4 text-xs font-bold text-[#1D5FA8]">Đọc tiếp ' +
        '<span class="material-symbols-outlined" style="font-size:16px;">arrow_forward</span></span>' +
        '</div></a>';
    }).join('');

    // Phân trang
    var pag = document.getElementById('pagination');
    if (totalPages <= 1) { pag.innerHTML = ''; }
    else {
      var html = '<div class="flex items-center justify-center gap-2">';
      for (var i = 1; i <= totalPages; i++) {
        html += '<button data-page="' + i + '" class="w-10 h-10 rounded-xl font-bold text-sm transition-all btn-press ' +
          (i === page ? 'bg-[#1D5FA8] text-white' : 'bg-white border border-gray-200 text-gray-600 hover:border-[#1D5FA8]') +
          '">' + i + '</button>';
      }
      html += '</div>';
      pag.innerHTML = html;
      pag.querySelectorAll('[data-page]').forEach(function (b) {
        b.addEventListener('click', function () {
          page = Number(b.dataset.page);
          render();
          window.scrollTo({ top: 0, behavior: 'smooth' });
        });
      });
    }

    renderFilters();
  }

  render();
})();
</script>
